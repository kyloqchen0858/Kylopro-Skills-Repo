<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>封面审阅 · INKA+</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff2f4;color:#182635;font:16px system-ui}main{max-width:1480px;margin:auto;padding:24px}nav,header{display:flex;justify-content:space-between;align-items:center}a{color:#345671}h1{font:normal 32px Georgia,serif}section{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,310px);gap:24px}#art{align-self:start;background:white;cursor:crosshair;position:relative}#art svg{width:100%;height:auto;display:block}#dot{position:absolute;width:14px;height:14px;border:2px solid white;border-radius:50%;background:#d63f2d;transform:translate(-50%,-50%);pointer-events:none}aside{background:white;padding:18px}textarea,button{font:inherit}textarea{width:100%;padding:9px}button{padding:8px;margin-top:8px;cursor:pointer}small{color:#456}article{margin-top:16px;border-top:1px solid #ddd;padding-top:12px}#info{min-height:1.3em}@media(max-width:800px){section{display:block}}
</style><main><nav><a href="/covers">← 封面工坊</a><a id="edit">图层编辑器 ↗</a></nav><header><h1 id="heading"></h1><small id="version"></small></header><section><div id="art"></div><aside><h2>给设计师的意见</h2><p>点一下封面，标出你想改的位置。</p><label id="target" for="message">整张封面</label><textarea id="message" rows="4" placeholder="例如：这段金线再短一点"></textarea><button id="send">提交给设计 Agent</button><p id="info" role="status"></p><div id="notes"></div></aside></section></main><script type="module">
const el=id=>document.getElementById(id), edition=new URLSearchParams(location.search).get('edition')||'orbit',query='?edition='+encodeURIComponent(edition);
let record,anchor,submitting=false;
el('edit').href='/editor'+query;el('heading').textContent=edition==='orbit'?'回望之弧':'回声地形';
async function api(path,body){const res=await fetch(path+query,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const data=await res.json();if(!res.ok)throw Error(data.error||res.status);return data}
async function load(){const next=await api('/state');if(record?.rev===next.rev)return;const r=await fetch('/preview'+query+'&rev='+next.rev);if(!r.ok)throw Error('预览读取失败');const svg=new DOMParser().parseFromString(await r.text(),'image/svg+xml').documentElement;el('art').replaceChildren(document.importNode(svg,true));record=next;anchor=null;el('target').textContent='整张封面';el('version').textContent='审阅稿 v'+next.rev;el('notes').replaceChildren();for(const n of [...(next.state.discussion||[])].reverse()){const a=document.createElement('article');a.textContent=[n.targetName,n.message,n.status,n.reply].filter(Boolean).join(' · ');el('notes').append(a)}}
el('art').onclick=e=>{const svg=el('art').querySelector('svg');if(!svg)return;const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());const obj=e.target.closest('[data-object]');anchor={id:obj?.dataset.object||'',name:obj?.querySelector('title')?.textContent||'画布',x:pt.x.toFixed(1),y:pt.y.toFixed(1)};el('target').textContent=anchor.name+' · '+anchor.x+', '+anchor.y+' mm';const b=el('art').getBoundingClientRect(),dot=document.createElement('i');el('dot')?.remove();dot.id='dot';dot.style.left=(e.clientX-b.left)/b.width*100+'%';dot.style.top=(e.clientY-b.top)/b.height*100+'%';el('art').append(dot);el('message').focus()};
el('send').onclick=async()=>{const msg=el('message').value.trim();if(!msg||submitting)return;submitting=true;el('send').disabled=true;let saved=false;try{const r=await api('/change',{base:record.rev,label:'封面定位意见',ops:[{action:'comment',target:anchor?.id||'',message:msg,purpose:'审阅 v'+record.rev+(anchor?' · '+anchor.x+', '+anchor.y+' mm':'')}]});saved=true;el('message').value='';await api('/dispatch',{base:r.rev,note:r.state.discussion.at(-1).id});el('info').textContent='设计 Agent 已接单。'}catch(err){el('info').textContent=(saved?'意见已保存。':'')+err.message}finally{try{await load()}finally{submitting=false;el('send').disabled=false}}};
await load();setInterval(()=>{if(!submitting&&!anchor&&!el('message').value)load().catch(err=>el('info').textContent=err.message)},8000)
</script></html>
